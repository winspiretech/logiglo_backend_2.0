name: CI/CD Pipeline for logiglo_backend_2.0

on:
  push:
    branches: [main, test]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./.github/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/logiglo_backend_2.0:${{ github.ref == 'refs/heads/main' && 'latest' || 'test' }}

  deploy-test:
    if: github.ref == 'refs/heads/test'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Test Server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          port: 22
          key: ${{ secrets.REMOTE_KEY }}
          script: |
            mkdir -p /root/backend
            cd /root/backend

            if [ ! -f docker-compose.yml ]; then
              echo "❌ docker-compose.yml not found in /root/backend"
              exit 1
            fi

            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            docker-compose down --remove-orphans || true
            docker stop logiglo_backend_2.0 logiglo_backend_postgres 2>/dev/null || true
            docker rm -f logiglo_backend_2.0 logiglo_backend_postgres 2>/dev/null || true

            docker pull ${{ secrets.DOCKER_USERNAME }}/logiglo_backend_2.0:test

            docker-compose up -d

            sleep 10

            if docker-compose ps | grep -q "Up"; then
              echo "✅ Deployment successful"
              docker-compose ps
              docker image prune -f
            else
              echo "❌ Deployment failed"
              docker-compose logs
              exit 1
            fi
